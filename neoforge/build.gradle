plugins {
    id 'idea'
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'net.darkhax.curseforgegradle' version '1.1.+'
    id "com.modrinth.minotaur" version "2.+"
}

base {
    archivesName = "${mod_name}-neoforge-${minecraft_version}"
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file("runs/data"))
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
	jarJar(implementation ("mysticdrew:common-networking-neoforge:${common_networking}-26.1")) { transitive false }
    implementation "maven.modrinth:iris:${iris_version}+26.1-fabric"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("curse_auth")

    var mainFile = upload(222967, jar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.findProperty('mod_changelog')
    mainFile.addJavaVersion('Java 25')
    mainFile.releaseType = 'release'
    mainFile.addModLoader('NeoForge')
    def vr = rootProject.parseVersionRange(minecraft_version_range, minecraft_version)
    mainFile.addGameVersion(*vr.quoted)
}

modrinth {
    var changelogText = rootProject.findProperty('mod_changelog')

    token = System.getenv("modrinth_auth")
    projectId = "Qaq8E11f"
    changelog = changelogText
    versionNumber = "${version}"
    versionName = "${mod_name}-neoforge-${minecraft_version}-${version}"
    versionType = "release"
    loaders = ["neoforge"]
    gameVersions = rootProject.parseVersionRange(minecraft_version_range, minecraft_version).list
    uploadFile = jar
}
